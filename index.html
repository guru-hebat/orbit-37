<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORBIT 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 12% 18%,
          rgba(186, 213, 235, 0.55),
          transparent 38%
        ),
        radial-gradient(
          circle at 88% 78%,
          rgba(245, 222, 235, 0.55),
          transparent 36%
        ),
        radial-gradient(
          circle at 65% 10%,
          rgba(214, 240, 220, 0.45),
          transparent 34%
        ),
        radial-gradient(
          circle at 25% 88%,
          rgba(255, 240, 215, 0.45),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #FBFDFE 0%,
          #F7F9FC 48%,
          #FDFCFB 100%
        );

      background-attachment: fixed;

      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FBFDFE;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ========================================
         IFRAME APLIKASI
         ======================================== -->

    <div class="iframe-container">

      <iframe
        id="appFrame"
        src=""
        allow="fullscreen; camera; microphone"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads">
      </iframe>

    </div>

  </div>


  <script>

    // =============================================
    // URL GOOGLE APPS SCRIPT
    // =============================================

    var APP_URL = "https://script.google.com/macros/s/AKfycbw4jNkwe7Md7AicIzKkWy-Xwur1WtkRt8lrH1J6UafEjRFZKLukrs1jgNo6-9FMHWQo/exec";

    var appFrame = document.getElementById('appFrame');


    // =============================================
    // HANDLER REQUEST DARI IFRAME
    // =============================================

    window.addEventListener('message', function(event) {

      try {

        var data = event.data;

        if (!data || typeof data !== 'object') return;


        // 1. Buka tab kosong

        if (data.action === 'openBlank') {

          window.open('', '_blank');

          return;
        }


        // 2. Buka URL langsung

        if (data.action === 'openDownload' && data.url) {

          window.open(data.url, '_blank');

          return;
        }


        // 3. Fullscreen

        if (data.action === 'requestFullscreen') {

          var el = document.documentElement;

          var fn =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.msRequestFullscreen;

          if (fn) fn.call(el).catch(function(){});

          return;
        }

      } catch(e) {

        console.warn('PostMessage error:', e);

      }

    });


    // =============================================
    // LOAD APLIKASI KE IFRAME
    // =============================================

    function loadApp() {

      var params =
        new URLSearchParams(window.location.search);

      var id = params.get('id');

      var targetUrl = APP_URL;


      if (id) {

        if (targetUrl.indexOf('?') !== -1) {

          targetUrl += "&id=" + id;

        } else {

          targetUrl += "?id=" + id;

        }

      }


      appFrame.src = targetUrl;

    }


    window.addEventListener(
      'DOMContentLoaded',
      loadApp
    );

  </script>

</body>
</html>
